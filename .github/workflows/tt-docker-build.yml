name: TT Docker Build (ghcr)

# TripTech build of our patched Sequin for Railway (linux/amd64).
# Trigger manually with the version, or push a v*-tt* tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag (e.g. v0.14.6-tt1)'
        required: true
  push:
    tags:
      - 'v*-tt*'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SELF_HOSTED=1
            RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/triptechtravel/sequin:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
